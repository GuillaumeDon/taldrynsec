<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — TaldrynSec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav"></nav>
  <main class="main">
    <div class="page-header">
      <h1>Notes</h1>
      <p>All my revision notes from Ynov, TryHackMe, and other sources. Use the filters to find what you need.</p>
    </div>
    <div class="filter-bar">
      <div class="filter-label">Source</div>
      <button class="filter-btn active" data-filter-type="source" data-filter="all">All</button>
      <button class="filter-btn" data-filter-type="source" data-filter="ynov">Ynov</button>
      <button class="filter-btn" data-filter-type="source" data-filter="tryhackme">TryHackMe</button>
      <button class="filter-btn" data-filter-type="source" data-filter="other">Other</button>
    </div>
    <div class="filter-bar">
      <div class="filter-label">Topic</div>
      <button class="filter-btn active" data-filter-type="topic" data-filter="all">All</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="blue-team">Blue Team</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="red-team">Red Team</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="networking">Networking</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="linux">Linux</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="web-security">Web Security</button>
      <button class="filter-btn" data-filter-type="topic" data-filter="crypto">Cryptography</button>
    </div>
    <div class="cards-grid" id="notes-grid"></div>
  </main>
  <footer class="site-footer"></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
